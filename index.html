<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Военный атлас — прототип</title><style>*{box-sizing:border-box}body{margin:0;background:#101c25;color:#e6e5da;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}header{position:absolute;top:15px;left:18px;right:18px;padding:14px 20px;background:#14232beF;border:1px solid #77735c;display:flex;justify-content:space-between;pointer-events:none}h1{margin:0;font-size:19px;letter-spacing:3px;color:#ddc99a}aside{position:absolute;bottom:20px;left:18px;width:300px;background:#14232bf2;border:1px solid #77735c;padding:18px}button{background:#586c48;color:white;border:1px solid #abb18d;padding:10px;cursor:pointer;margin:5px 0;width:100%}p{line-height:1.5;color:#bfcbc9}small{color:#bdc9cb}#help{position:absolute;bottom:20px;right:20px;text-align:right;pointer-events:none;color:#d2dddd;text-shadow:0 1px 4px black}</style><canvas id="map"></canvas><header><h1>ВОЕННЫЙ АТЛАС</h1><div id="stats"></div></header><aside><small>ИГРАБЕЛЬНЫЙ ПРОТОТИП · ВЫМЫШЛЕННЫЙ МИР</small><h2 id="name">Выберите провинцию</h2><p id="info">Синие территории принадлежат вам. Выберите свою армию, затем соседнюю провинцию и нажмите «Отправить армию».</p><div id="actions"></div><small id="log">Штаб готов к работе.</small></aside><div id="help">Перетаскивание — поворот карты<br>Колесо / кнопки — масштаб<br><button onclick="zoom*=1.15">＋</button><button onclick="zoom/=1.15">−</button></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W,H,zoom=1,angle=-.28,selected=null,origin=null,money=500,day=1,last=performance.now(),drag=null,moved=false;const cells=[],triangles=[],moves=[];const owners=['Республика','Северный союз','Восточная лига'];let seed=71;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function elevation(x,y){return Math.max(0,(Math.sin(x*.57)+Math.cos(y*.68)+Math.sin(x*.36+y*.51)*.9-.15)*.42)}
const names=['Арден','Брента','Вальден','Дорн','Эстен','Фальк','Грена','Хольм','Истра','Карен','Линден','Морна','Норд','Остер','Порта','Рейна','Сарен','Тарна','Ульм','Верна','Вест','Зальден'];
for(let j=0;j<12;j++)for(let i=0;i<17;i++){let x=(i-8)*1.1,y=(j-5.5)*1.05;if((x*x/88+y*y/38)>1+Math.sin(j*1.3)*.14|| (i<3&&j>7))continue;cells.push({i,j,x,y,z:elevation(x,y),owner:i<7?0:i<12?1:2,army:8+Math.floor(rand()*18),city:rand()>.67,name:names[(i+j*3)%names.length]+' '+(j+1),poly:[],factory:false})}
function height(x,y){return elevation(x,y)}function project(x,y,z){let a=x*Math.cos(angle)-y*Math.sin(angle),b=x*Math.sin(angle)+y*Math.cos(angle);let s=Math.min(W/22,H/15)*zoom;return [W*.55+a*s,H*.49+b*s*.59-z*s*.85]}
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=resize;resize();
function inside(p,v){let yes=false;for(let i=0,j=v.length-1;i<v.length;j=i++){if(((v[i][1]>p[1])!=(v[j][1]>p[1]))&&(p[0]<(v[j][0]-v[i][0])*(p[1]-v[i][1])/(v[j][1]-v[i][1])+v[i][0]))yes=!yes}return yes}
function path(p){ctx.beginPath();p.forEach((q,k)=>k?ctx.lineTo(...q):ctx.moveTo(...q));ctx.closePath()}
function panel(){if(!selected)return;let a=selected;document.querySelector('#name').textContent=a.name;document.querySelector('#info').textContent=owners[a.owner]+' · '+a.army+' ед. войск'+(a.city?' · Город':'')+(a.factory?' · Завод':'');let box=document.querySelector('#actions');box.innerHTML='';function btn(text,f){let b=document.createElement('button');b.textContent=text;b.onclick=f;box.append(b)}if(a.owner===0){btn('Выбрать армию',()=>{origin=a;note('Армия выбрана. Укажите соседнюю провинцию.')});btn('Пополнить +5 · 100 монет',()=>{if(money>=100){money-=100;a.army+=5;panel()}});if(!a.factory)btn('Построить завод · 200 монет',()=>{if(money>=200){money-=200;a.factory=true;panel()}})}if(origin&&origin!==a&&Math.abs(origin.i-a.i)+Math.abs(origin.j-a.j)===1)btn('Отправить армию',()=>{if(origin.army<2)return;let count=origin.army-1;origin.army=1;moves.push({from:origin,to:a,n:count,t:0});origin=null;note('Приказ принят: армия в пути.');panel()})}
function note(s){document.querySelector('#log').textContent=s}
c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,a:angle};moved=false;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){if(Math.abs(e.clientX-drag.x)>5)moved=true;angle=drag.a+(e.clientX-drag.x)*.004}};c.onpointerup=e=>{if(!moved){selected=[...cells].reverse().find(a=>inside([e.clientX,e.clientY],a.poly));panel()}drag=null};c.onwheel=e=>{e.preventDefault();zoom=Math.min(2.7,Math.max(.45,zoom*Math.exp(-e.deltaY*.001))) };
function frame(now){let dt=Math.min(.1,(now-last)/1000);last=now;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#172c3d');g.addColorStop(1,'#366170');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff08';for(let y=0;y<H;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y-80);ctx.stroke()}
let sorted=[...cells].sort((a,b)=>(a.x*Math.sin(angle)+a.y*Math.cos(angle))-(b.x*Math.sin(angle)+b.y*Math.cos(angle)));
for(let a of sorted){let corners=[[-.55,-.525],[.55,-.525],[.55,.525],[-.55,.525]];a.poly=corners.map(([x,y])=>project(a.x+x,a.y+y,height(a.x+x,a.y+y)));let shade=Math.round(47+a.z*28);ctx.fillStyle=['hsl(164,24%,'+shade+'%)','hsl(45,23%,'+shade+'%)','hsl(17,23%,'+shade+'%)'][a.owner];path(a.poly);ctx.fill();ctx.strokeStyle=a===selected?'#ffdf82':a===origin?'#80eaff':'#242c2999';ctx.lineWidth=a===selected?3:1;ctx.stroke();let p=project(a.x,a.y,a.z);if(a.city){ctx.fillStyle='#2b3232';for(let k=0;k<3;k++)ctx.fillRect(p[0]-9+k*7,p[1]-14-k%2*5,5,12+k%2*5)}ctx.fillStyle=['#234f74','#6e4930','#782f2e'][a.owner];ctx.fillRect(p[0]-13,p[1]+1,26,17);ctx.strokeStyle='#d7cba5';ctx.strokeRect(p[0]-13,p[1]+1,26,17);ctx.fillStyle='white';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(a.army,p[0],p[1]+13);if(a.city&&zoom>.85){ctx.font='10px system-ui';ctx.fillStyle='#eee6c6';ctx.fillText(a.name,p[0],p[1]+31)}}
for(let k=moves.length-1;k>=0;k--){let m=moves[k];m.t+=dt/7;let a=project(m.from.x,m.from.y,m.from.z+.25),b=project(m.to.x,m.to.y,m.to.z+.25);ctx.strokeStyle='#f4d483';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffe2a2';ctx.beginPath();ctx.arc(a[0]+(b[0]-a[0])*m.t,a[1]+(b[1]-a[1])*m.t,5,0,7);ctx.fill();if(m.t>=1){if(m.to.owner===0)m.to.army+=m.n;else{let defense=m.to.army;m.to.army=Math.max(1,Math.abs(m.n-defense));if(m.n>defense){m.to.owner=0;note('Провинция '+m.to.name+' захвачена.')}else note('Атака отражена.')}moves.splice(k,1);panel()}}
document.querySelector('#stats').textContent='День '+day+'  |  Казна: '+money+'  |  Провинции: '+cells.filter(a=>a.owner===0).length;requestAnimationFrame(frame)}
setInterval(()=>{day++;money+=cells.filter(a=>a.owner===0).reduce((s,a)=>s+(a.factory?15:3),0);cells.filter(a=>a.factory).forEach(a=>a.army++);panel()},15000);requestAnimationFrame(frame);
</script></html>
