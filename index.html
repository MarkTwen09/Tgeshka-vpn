<div id="msg"><h1>NEON DASH 3D</h1><p>Пробел / ЛКМ / тап — прыжок (в режиме корабля — удерживай)<br>Шипы убивают, блоки можно приземляться сверху, жёлтые площадки подбрасывают<br>Фиолетовый портал = корабль, зелёный = куб</p><p><b>Нажми, чтобы начать</b></p></div>

import * as THREE from 'three';
const R=innerWidth/innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();

const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(-6,16,12);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,far:80});
scene.add(sun,sun.target);
const pl=new THREE.PointLight(0x00ffff,60,30);scene.add(pl);

// ---------- seeded RNG & level ----------
let seed=1337;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const blocks=[],spikes=[],pads=[],portals=[];
const B=(x,y,w=1,h=1)=>blocks.push({x,y,w,h});
const S=(x,y=0)=>spikes.push({x,y});
let x=22;
function sec(){
  const t=Math.floor(rnd()*7);
  if(t==0){S(x);x+=7}
  else if(t==1){S(x);S(x+1);x+=8}
  else if(t==2){S(x);S(x+1);S(x+2);x+=9}
  else if(t==3){B(x,0);S(x+3);x+=9}
  else if(t==4){B(x,0);B(x+1,0);B(x+1,1);B(x+2,0);B(x+2,1);B(x+2,2);S(x+3);S(x+4);x+=10}
  else if(t==5){pads.push({x,y:0});B(x+5,0,3,3);S(x+3);x+=12}
  else {B(x,0,3,1);S(x+3);S(x+4);B(x+7,0,2,2);x+=12}
}
function ship(len){
  portals.push({x,y:0,type:'ship'});x+=8;const x0=x;
  for(let i=0;i<len;i+=4){
    const c=4.6+2.2*Math.sin(i*.35)+(rnd()-.5);const gap=4.6;
    const fl=c-gap/2,ce=c+gap/2;
    B(x0+i,0,2,fl);B(x0+i,ce,2,9.4-ce);
  }
  x=x0+len+4;portals.push({x,y:0,type:'cube'});x+=8;
}
for(let i=0;i<4;i++)sec();
ship(60);
for(let i=0;i<5;i++)sec();
ship(80);
for(let i=0;i<6;i++)sec();
const END=x+10;

// ---------- world ----------
const edgeMat=new THREE.LineBasicMaterial({color:0xffffff});
const blockMat=new THREE.MeshStandardMaterial({color:0x2200aa,emissive:0x110055,roughness:.4,metalness:.3});
const spikeMat=new THREE.MeshStandardMaterial({color:0xff1155,emissive:0x660022,roughness:.3});
const group=new THREE.Group();scene.add(group);
for(const b of blocks){
  const g=new THREE.BoxGeometry(b.w,b.h,1);
  const m=new THREE.Mesh(g,blockMat);m.position.set(b.x+b.w/2,b.y+b.h/2,0);m.castShadow=m.receiveShadow=true;
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),edgeMat);m.add(e);group.add(m);
}
const spG=new THREE.ConeGeometry(.5,1,4);spG.rotateY(Math.PI/4);
for(const s of spikes){
  const m=new THREE.Mesh(spG,spikeMat);m.scale.set(1,1,1);m.position.set(s.x+.5,s.y+.5,0);m.castShadow=true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(spG),new THREE.LineBasicMaterial({color:0xffaaaa})));
  group.add(m);
}
const padMesh=[];
for(const p of pads){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.45,.5,.2,16),new THREE.MeshStandardMaterial({color:0xffee00,emissive:0xaa8800}));
  m.position.set(p.x+.5,.1,0);group.add(m);padMesh.push(m);
}
const portMesh=[];
for(const p of portals){
  const col=p.type=='ship'?0xcc33ff:0x33ff66;
  const m=new THREE.Mesh(new THREE.TorusGeometry(1.8,.18,12,32),new THREE.MeshBasicMaterial({color:col}));
  m.position.set(p.x+.5,p.type=='ship'?1.8:1.8,0);m.rotation.y=Math.PI/2;
  const inner=new THREE.Mesh(new THREE.CircleGeometry(1.6,24),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.18,side:2}));
  inner.rotation.y=0;m.add(inner);m.position.y=p.type=='ship'?1.8:1.8;group.add(m);portMesh.push(m);
}
// finish
const fin=new THREE.Mesh(new THREE.BoxGeometry(1,40,12),new THREE.MeshBasicMaterial({color:0xffffff}));
fin.position.set(END,20,0);scene.add(fin);

// floor, ceiling grid, decor
const floorMat=new THREE.MeshStandardMaterial({color:0x08001a,roughness:.2,metalness:.8});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(2000,200),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(500,-.001,0);floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(2000,2000,0x00ffff,0x5500aa);grid.scale.z=.1;grid.position.set(500,0,0);grid.scale.set(1,1,1);scene.add(grid);
const decor=[];
const dG=new THREE.BoxGeometry(2,1,2);
for(let i=0;i<160;i++){
  const h=4+rnd()*26;const side=i%2?1:-1;
  const m=new THREE.Mesh(dG,new THREE.MeshStandardMaterial({color:0x220055,emissive:0xff00ff,emissiveIntensity:.25}));
  m.scale.y=h;m.position.set(i*(END/80)+rnd()*4,h/2,side*(10+rnd()*22));
  m.userData.ph=rnd()*6;scene.add(m);decor.push(m);
}
const stG=new THREE.BufferGeometry();const sp=[];
for(let i=0;i<1500;i++)sp.push(rnd()*END*1.2,10+rnd()*60,(rnd()-.5)*120);
stG.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(stG,new THREE.PointsMaterial({size:.4,color:0xffffff,fog:false})));

// ---------- player ----------
const player=new THREE.Group();scene.add(player);
const cubeG=new THREE.BoxGeometry(.9,.9,.9);
const cubeMesh=new THREE.Mesh(cubeG,new THREE.MeshStandardMaterial({color:0x00ffcc,emissive:0x008866,roughness:.3,metalness:.4}));
cubeMesh.castShadow=true;
const face=new THREE.Mesh(new THREE.BoxGeometry(.5,.2,.05),new THREE.MeshBasicMaterial({color:0x001111}));face.position.set(.1,.1,.46);
cubeMesh.add(face,new THREE.LineSegments(new THREE.EdgesGeometry(cubeG),new THREE.LineBasicMaterial({color:0xffffff})));
const shipMesh=new THREE.Mesh(new THREE.ConeGeometry(.5,1.4,4),new THREE.MeshStandardMaterial({color:0xff66ff,emissive:0x880088}));
shipMesh.rotation.z=-Math.PI/2;shipMesh.castShadow=true;
player.add(cubeMesh);
const trail=[];
const partG=new THREE.BoxGeometry(.18,.18,.18);
const parts=[];
function burst(px,py,col,n=40,sp=9){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(partG,new THREE.MeshBasicMaterial({color:col,transparent:true}));
    m.position.set(px,py,0);scene.add(m);
    parts.push({m,v:new THREE.Vector3((Math.random()-.5)*sp,Math.random()*sp,(Math.random()-.5)*sp),life:1});
  }
}

// ---------- audio ----------
let ac,beatT=0;
function beep(f,d,type='sine',v=.15){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}
const notes=[55,55,65.4,49,55,55,73.4,49];let nIdx=0;
function music(dt){
  beatT+=dt;const bl=60/140/2;
  while(beatT>=bl){beatT-=bl;beep(notes[nIdx%8]*2,.18,'sawtooth',.06);if(nIdx%2==0)beep(60,.15,'sine',.25);if(nIdx%4==2)beep(1800,.04,'square',.03);nIdx++}
}

// ---------- game state ----------

let px,py,vy,mode,grounded,hold,dead,deadT,attempts=0,best=0,started=false,won=false,t=0,rot,flip;
function reset(){
  px=0;py=0;vy=0;mode='cube';grounded=true;dead=false;deadT=0;won=false;rot=0;attempts++;
  player.clear();player.add(cubeMesh);cubeMesh.visible=true;player.visible=true;
  document.getElementById('att').textContent='Попытка '+attempts;
}
reset();
function die(){
  if(dead)return;dead=true;deadT=0;player.visible=false;
  burst(px,py+.5,0x00ffcc,50);burst(px,py+.5,0xff00ff,30);beep(90,.4,'sawtooth',.3);beep(45,.5,'square',.2);
  best=Math.max(best,Math.floor(px/END*100));document.getElementById('best').textContent='Рекорд '+best+'%';
  shake=.6;
}
let shake=0;
function press(v){hold=v;if(v&&!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();press(true);start()}});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))press(false)});
addEventListener('pointerdown',()=>{press(true);start()});addEventListener('pointerup',()=>press(false));
function start(){if(!started){started=true;document.getElementById('msg').style.display='none'}}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
